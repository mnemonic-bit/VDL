name: Validation

on:
    pull_request:
        branches:
            - main
    workflow_call:

permissions:
    contents: read

jobs:
    deterministic-gate:
        name: Deterministic gate
        runs-on: ubuntu-24.04
        timeout-minutes: 60
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  fetch-depth: 0

            - name: Set up Python
              uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
              with:
                  python-version: "3.12"

            - name: Set up Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: "24.8.0"
                  package-manager-cache: false

            - name: Install workflow and extension tooling
              run: npm ci

            - name: Validate CodeQL action pins
              run: |
                  node scripts/check-codeql-pins.cjs
                  node --test tests/codeql-pins.test.cjs

            - name: Install native dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install --yes ffmpeg
                  python -m pip install --upgrade pip
                  python -m pip install -r requirements.txt

            - name: Validate multi-platform container dependency lock
              run: ./tests/container/check-lock.sh

            - name: Verify Firefox companion package contents
              env:
                  BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
              run: |
                  npm run extension:lint
                  npm run extension:build -- --artifacts-dir "$RUNNER_TEMP/extension-build"
                  python scripts/extension_release.py validate --base-ref "$BASE_REF" \
                      --built-dir "$RUNNER_TEMP/extension-build"

            - name: Install browser dependencies
              working-directory: tests/browser
              run: |
                  npm ci
                  npx playwright install --with-deps chromium

            - name: Run complete deterministic gate
              run: ./tests/run-all.sh --all
